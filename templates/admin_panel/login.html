<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Gujarati Samaj</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ff6b35 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: white; border-radius: 20px;
      padding: 40px; width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo-section { text-align: center; margin-bottom: 30px; }
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px; font-size: 30px; color: white;
    }
    .logo-section h2 { color: #ff6b35; font-weight: 700; }
    .form-control:focus {
      border-color: #ff6b35;
      box-shadow: 0 0 0 0.2rem rgba(255,107,53,0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white; border: none; padding: 12px;
      font-size: 16px; font-weight: 600;
      border-radius: 10px; width: 100%;
    }
    .btn-login:hover { opacity: 0.9; color: white; }
    .register-link { text-align: center; margin-top: 20px; color: #888; font-size: 14px; }
    .register-link a { color: #ff6b35; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo-section">
    <div class="logo-icon"><i class="fas fa-om"></i></div>
    <h2>Gujarati Samaj</h2>
    <p class="text-muted">Community Management Portal</p>
  </div>

  {% if form.errors %}
    <div class="alert alert-danger">Invalid username or password.</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-500">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required/>
    </div>
    <div class="mb-4">
      <label class="form-label fw-500">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required/>
    </div>
    <input type="hidden" name="next" value="{{ next }}"/>
    <button type="submit" class="btn-login">
      <i class="fas fa-sign-in-alt me-2"></i>Login
    </button>
  </form>

  <div class="register-link">
    New member? <a href="{% url 'register' %}">Register here</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
